name: Fork APK (debug)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

env:
  KEYSTORE_PATH: ${{ github.workspace }}/android/fork-debug.jks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      # A stable key: Android refuses an update signed by a different key, and the
      # runner's debug keystore is regenerated for every job.
      - name: Restore signing key
        run: |
          echo "${{ secrets.FORK_KEYSTORE_B64 }}" | base64 -d > "$KEYSTORE_PATH"
          ls -l "$KEYSTORE_PATH"
      # A fresh versionCode per run, so an update is always an upgrade.
      - name: Bump versionCode
        run: |
          CODE=$((3066 + ${{ github.run_number }}))
          sed -i "s/^version: .*/version: 4.0.10+$CODE/" pubspec.yaml
          grep '^version:' pubspec.yaml
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK (arm64)
        env:
          FORK_KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64
      # Debug is kept as a fallback download: it is ~5x the size, but it always
      # runs even if a release-only shrink step misbehaves.
      - name: Build debug APK (arm64)
        env:
          FORK_KEYSTORE_FILE: ${{ env.KEYSTORE_PATH }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify signature and versionCode
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          for APK in build/app/outputs/flutter-apk/app-release.apk \
                     build/app/outputs/flutter-apk/app-debug.apk; do
            echo "== $APK ($(du -h "$APK" | cut -f1))"
            "$BT/apksigner" verify --print-certs "$APK" | head -4
            "$BT/aapt2" dump badging "$APK" | grep -E "^package:"
          done
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ares-ssh-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      # Obtainium follows GitHub releases: tag = versionCode so updates order
      # numerically, and one .apk asset per release.
      - name: Publish release for Obtainium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ares-fork-$VERSION_CODE.apk"
          ls -l "$PWD/ares-fork-$VERSION_CODE.apk"
          gh release create "$VERSION_CODE" "ares-fork-$VERSION_CODE.apk" \
            --repo "${{ github.repository }}" \
            --title "Ares fork $VERSION_CODE" \
            --notes "SSH tunnel + Discord filter + rewind. versionCode $VERSION_CODE."
